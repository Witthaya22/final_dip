<!doctype html>
<!--
  =====================================================================
   STEP 6 : Frontend (หน้าบ้าน) - หน้าเว็บสำหรับอัปโหลดภาพแล้วให้ YOLO ทาย
  =====================================================================
   โครงหน้าเว็บ:
     [ส่วนหัว]    ชื่อโปรเจกต์ + สถานะว่าเชื่อมต่อ API ได้ไหม
     [แผงซ้าย]   เลือกภาพ (ลากวาง / กดเลือก) + ตั้งค่า confidence
     [แผงขวา]    แสดงผล: ภาพที่วาด polygon + รายการวัตถุที่เจอ
   ใช้โมเดล Polygon (segment) อย่างเดียว
   ไฟล์ที่เกี่ยวข้อง:
     config.js  -> ตั้งค่า URL ของ API (หลังบ้าน)
     app.js     -> โค้ดทั้งหมดที่ทำให้หน้าเว็บทำงาน (เรียก API, วาดผล)
     infer.js   -> รันโมเดลในเบราว์เซอร์ (ตอนไม่มีหลังบ้าน)
     style.css  -> หน้าตาเว็บ
-->
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YOLO Vehicle Detector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>YOLO Vehicle Detector</h1>
      <p class="sub">final_dip · Polygon (segment) · airplane · boat · car · motorcycle</p>
    </div>
    <!-- จุดแสดงสถานะ API: app.js จะเปลี่ยนข้อความ/สีให้ -->
    <span id="status" class="pill">connecting…</span>
  </header>

  <main>
    <!-- ====== แผงซ้าย: input ====== -->
    <section class="panel controls">
      <h2>1. เลือกภาพ</h2>
      <!-- กล่องลากวางไฟล์ (คลิกแล้วเปิดเลือกไฟล์ได้ด้วย) -->
      <label id="drop" class="drop">
        <input id="file" type="file" accept="image/*" hidden>
        <strong>ลากภาพมาวาง</strong> หรือ คลิกเพื่อเลือกไฟล์
        <small>jpg / png ไม่เกิน 10 MB</small>
      </label>

      <h2>2. ตั้งค่า</h2>
      <!-- confidence threshold: ผลที่มั่นใจต่ำกว่านี้จะไม่แสดง -->
      <label class="slider">
        Confidence ขั้นต่ำ: <b id="confVal">0.25</b>
        <input id="conf" type="range" min="0.05" max="0.95" step="0.05" value="0.25">
      </label>

      <button id="run" disabled>3. ทำนาย (Predict)</button>
    </section>

    <!-- ====== แผงขวา: output (app.js สร้าง card ผลลัพธ์ใส่ในนี้) ====== -->
    <section id="results" class="results">
      <div class="empty">เลือกภาพแล้วกด <b>Predict</b> เพื่อดูว่าโมเดลทายว่าอะไร</div>
    </section>
  </main>

  <!-- ONNX Runtime Web: ใช้รันโมเดลในเบราว์เซอร์ ตอนที่ไม่มี server (โหมด browser) -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
  <script src="config.js"></script>
  <script src="infer.js"></script>
  <script src="app.js"></script>
</body>
</html>
